name: Build iOS IPA (EAS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/expo/**'
      - '.github/workflows/build-ipa.yml'

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build IPA via EAS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/expo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link project to EAS
        run: eas init --account danlah --non-interactive

      - name: Build iOS IPA
        id: eas-build
        env:
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_PASSWORD: ${{ secrets.EXPO_APPLE_PASSWORD }}
        run: |
          eas build \
            --platform ios \
            --profile sideload \
            --non-interactive \
            --json > /tmp/eas-build.json
          BUILD_ID=$(python3 -c "import json;d=json.load(open('/tmp/eas-build.json'));print(d[0]['id'] if isinstance(d,list) else d['id'])")
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Build ID: $BUILD_ID"

      - name: Download IPA
        run: |
          eas build:download ${{ steps.eas-build.outputs.build_id }} \
            --platform ios \
            --output-dir build \
            --non-interactive

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: myflighttracker-ios-ipa
          path: |
            apps/expo/build/**/*.ipa
          if-no-files-found: error
