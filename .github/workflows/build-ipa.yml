name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/expo/**'
      - '.github/workflows/build-ipa.yml'

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/expo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Prebuild iOS project
        run: bunx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Archive app (no code signing)
        run: |
          xcodebuild archive \
            -workspace ios/myFlightTracker.xcworkspace \
            -scheme myFlightTracker \
            -configuration Release \
            -archivePath build/myFlightTracker.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/myFlightTracker.xcarchive/Products/Applications/myFlightTracker.app \
            build/ipa/Payload/
          cd build/ipa
          zip -q -r ../myFlightTracker.ipa Payload
          ls -lh ../myFlightTracker.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: myflighttracker-ios-ipa
          path: apps/expo/build/myFlightTracker.ipa
          if-no-files-found: error
